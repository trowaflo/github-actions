# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
# Même motif que security.yml : KICS lit docker://…@sha256 comme non épinglé,
# et la garde sha-check de ci.yml tient l'épinglage de ce fichier.
name: Lint Renovate Config

# Reusable workflow — Validation des fichiers de configuration Renovate
# Usage: uses: trowaflo/github-actions/.github/workflows/lint-renovate.yml@<sha>

on:
  workflow_call:
    inputs:
      config_files:
        description: "Glob pattern of files to validate (default: *.json *.json5 at root)"
        type: string
        default: ""

      enable_harden_runner:
        description: "Runtime security via StepSecurity harden-runner"
        type: boolean
        default: true
      harden_runner_allowed_endpoints:
        description: "Extra endpoints to allow (merged with built-in defaults, space-separated)"
        type: string
        default: ""
      harden_runner_egress_policy:
        description: "Harden-runner egress policy: audit (observe) or block (enforce allowlist)"
        type: string
        default: "block"
permissions: {}

jobs:
  validate:
    name: Renovate Config Validator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, not workflow-level: in a called workflow, workflow-level concurrency
    # applies to the caller's run. The file-job suffix keeps the group distinct from
    # the caller's own `<workflow>-<ref>` group, so the two cannot deadlock.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-renovate-validate
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Built-in harden-runner allowed endpoints. The renovate image is pulled during
      # job setup, before harden-runner starts, and the validator reads local files
      # only, so nothing beyond checkout is listed.
      #   agent.api.stepsecurity.io:443 — harden-runner agent
      #   api.github.com:443 — GitHub API (actions runtime)
      #   github.com:443 — git clone, actions checkout
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        github.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The shell expands config_files here, so a glob such as "*.json *.json5" keeps
      # working; the container step below receives plain paths.
      - name: List Renovate config files
        id: files
        env:
          CONFIG_FILES: ${{ inputs.config_files }}
        run: |
          if [ -n "$CONFIG_FILES" ]; then
            candidates="$CONFIG_FILES"
          else
            candidates=$(find . -maxdepth 1 -name '*renovate*' \( -name '*.json' -o -name '*.json5' \) 2>/dev/null || true)
          fi
          list=""
          for f in $candidates; do
            if [ -f "$f" ]; then list="$list $f"; fi
          done
          echo "Files to validate:${list:- none}"
          echo "list=${list# }" >> "$GITHUB_OUTPUT"

      # The renovate image runs pinned by digest instead of `npm install --global`,
      # which resolved hundreds of transitive packages at run time with no lockfile:
      # the digest freezes the whole dependency tree. A lockfile is not an option in
      # a called workflow, which only sees the caller's checkout.
      # --strict also fails on a config that only needs migrating: without it, a
      # deprecated option passes here and is rewritten silently by Renovate.
      - name: Validate Renovate config files
        if: ${{ steps.files.outputs.list != '' }}
        # The validation takes seconds: a step still running after 5 minutes is stuck,
        # and the job timeout alone would bill 15 of them.
        timeout-minutes: 5
        uses: docker://ghcr.io/renovatebot/renovate:43.104.6@sha256:47b481eb21edf0047ef90c93fd0e728758676c974c496c01221699bd3f3e8d77
        with:
          entrypoint: renovate-config-validator
          args: --strict ${{ steps.files.outputs.list }}
