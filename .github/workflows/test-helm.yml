name: Test Helm Workflows

# Validates ci-helm.yml, release-helm.yml, and ci-helm-cleanup.yml using
# the hello-world test fixture chart in tests/charts/.
#
# Triggered:
#   - workflow_dispatch (manual)
#   - pull_request (every PR)

on:
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  helm-ci:
    name: Test ci-helm.yml
    uses: ./.github/workflows/ci-helm.yml
    permissions:
      contents: write
      pull-requests: write
      packages: write
      checks: write
    with:
      enable_lint: true
      enable_unittest: true
      enable_bump: true
      enable_docs: true
      enable_docs_check: true
      enable_pr_charts: true
      enable_oci_pr_charts: true
      charts_dir: tests/charts
      harden_runner_egress_policy: block

  helm-release:
    name: Test release-helm.yml
    uses: ./.github/workflows/release-helm.yml
    permissions:
      contents: write
      pages: write
    with:
      enable_release: true
      harden_runner_egress_policy: block

  helm-pr-cleanup:
    name: Test ci-helm-cleanup.yml
    needs: [helm-ci]
    uses: ./.github/workflows/ci-helm-cleanup.yml
    permissions:
      contents: write
      pull-requests: write
    # Note: enable_oci_cleanup is intentionally NOT enabled here.
    # The reconciliation step lists every container package of the owner without
    # filtering by source repo (GHCR has no strict repo->package binding), so
    # enabling it under the github-actions test repo could scan/delete versions
    # belonging to other repos under the same owner (e.g. trowaflo/helm-charts).
    # The pilot in trowaflo/helm-charts#238 covers the cleanup path end-to-end.
    with:
      skip_event_check: true
      harden_runner_egress_policy: block
