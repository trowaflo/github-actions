name: Test Helm Workflows

# Validates ci-helm.yml, release-helm.yml, and ci-helm-cleanup.yml using
# the hello-world test fixture chart in tests/charts/.
#
# Triggered:
#   - workflow_dispatch (manual)
#   - pull_request (every PR)

on:
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  helm-ci:
    name: Test ci-helm.yml
    uses: ./.github/workflows/ci-helm.yml
    permissions:
      contents: write
      pull-requests: write
      packages: write
      checks: write
    with:
      enable_lint: true
      enable_unittest: true
      enable_bump: true
      enable_docs: true
      enable_docs_check: true
      enable_pr_charts: true
      enable_oci_pr_charts: true
      charts_dir: tests/charts
      harden_runner_egress_policy: block

  helm-release:
    name: Test release-helm.yml
    uses: ./.github/workflows/release-helm.yml
    permissions:
      contents: write
      pages: write
      packages: write
    with:
      enable_release: true
      enable_oci_release: true
      harden_runner_egress_policy: block

  helm-pr-cleanup:
    name: Test ci-helm-cleanup.yml
    needs: [helm-ci]
    uses: ./.github/workflows/ci-helm-cleanup.yml
    permissions:
      contents: write
      pull-requests: write
      # Requis par le job helm-pr-cleanup de ci-helm-cleanup.yml, qui le déclare.
      # Le contrat de permissions d'un workflow appelé est validé au démarrage,
      # indépendamment de enable_oci_cleanup et de tout `if:`. Sans cette ligne,
      # startup_failure. Aucun DELETE GHCR n'est émis pour autant, voir la note
      # ci-dessous : c'est enable_oci_cleanup qui commande cette étape.
      packages: write
    # Note: enable_oci_cleanup is intentionally NOT enabled here.
    # Even though the cleanup step filters by the "<repo>/" GHCR namespace prefix
    # (so it would only target packages produced by this repo's helm-pr-charts),
    # exercising it from test-helm.yml means every test PR on github-actions
    # would issue real DELETE calls against GHCR for any "<repo>/<chart>" version
    # whose tag matches a closed PR. We prefer to cover the cleanup path
    # end-to-end via the pilot in trowaflo/helm-charts#238 where the namespace
    # is dedicated to a real Helm repo.
    with:
      skip_event_check: true
      harden_runner_egress_policy: block
