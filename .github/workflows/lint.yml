name: Lint

# Reusable workflow — Code quality linting
# Usage: uses: trowaflo/github-actions/.github/workflows/lint.yml@<sha>
#
# Defaults on : actionlint = true (opt-out)
# Defaults opt-in : markdown, yaml, ansible, terraform, json, shellcheck, shfmt = false

on:
  workflow_call:
    inputs:
      enable_actionlint:
        description: "Lint GitHub Actions workflow files"
        type: boolean
        default: true
      enable_ansible_lint:
        description: "Lint Ansible with ansible-lint"
        type: boolean
        default: false
      enable_harden_runner:
        description: "Runtime security via StepSecurity harden-runner"
        type: boolean
        default: true
      enable_json_lint:
        description: "JSON and JSON5 syntax validation"
        type: boolean
        default: false

      enable_markdown_lint:
        description: "Lint Markdown with markdownlint-cli2"
        type: boolean
        default: false
      enable_shellcheck:
        description: "Lint shell scripts (bash/sh/zsh) with shellcheck via reviewdog (inline PR comments)"
        type: boolean
        default: false
      enable_shfmt:
        description: "Check shell script formatting with shfmt via reviewdog (inline PR comments)"
        type: boolean
        default: false
      enable_terraform_validate:
        description: "Terraform validation: fmt check + tflint"
        type: boolean
        default: false
      enable_yamllint:
        description: "Lint YAML with yamllint (auto-detects .yamllint.yml)"
        type: boolean
        default: false
      harden_runner_allowed_endpoints:
        description: "Extra endpoints to allow (merged with built-in defaults, space-separated)"
        type: string
        default: ""
      harden_runner_egress_policy:
        description: "Harden-runner egress policy: audit (observe) or block (enforce allowlist)"
        type: string
        default: "block"
permissions: {}

jobs:
  actionlint:
    if: ${{ inputs.enable_actionlint }}
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, not workflow-level: in a called workflow, workflow-level concurrency
    # applies to the caller's run. The file-job suffix keeps each group distinct from
    # the caller's own `<workflow>-<ref>` group, so the two cannot deadlock.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-actionlint
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    env:
      # Built-in harden-runner allowed endpoints. Each job lists only what it downloads:
      # the egress policy defaults to block, so a host listed here is a host a
      # compromised step can reach.
      #   agent.api.stepsecurity.io:443 — harden-runner agent
      #   api.github.com:443 — GitHub API (actions runtime, SARIF upload)
      #   github.com:443 — git clone, actions checkout, actionlint release
      #   raw.githubusercontent.com:443 — actionlint SARIF template download
      #   release-assets.githubusercontent.com:443 — actionlint release asset (redirect target)
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        github.com:443
        raw.githubusercontent.com:443
        release-assets.githubusercontent.com:443
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint with checksum verification
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          BASE_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSLO "${BASE_URL}/${ARCHIVE}"
          curl -fsSLO "${BASE_URL}/${CHECKSUMS}"
          grep " ${ARCHIVE}$" "${CHECKSUMS}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" actionlint
      - name: Run actionlint
        run: ./actionlint -color
      - name: Run actionlint (SARIF)
        if: ${{ always() && github.event.repository.visibility == 'public' }}
        run: |
          set -euo pipefail
          SARIF_TEMPLATE="$(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/testdata/format/sarif_template.txt")"
          ./actionlint -format "$SARIF_TEMPLATE" > actionlint-results.sarif || true
      - name: Upload actionlint SARIF
        if: ${{ always() && github.event.repository.visibility == 'public' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: actionlint-results.sarif
          category: actionlint

  markdown-lint:
    if: ${{ inputs.enable_markdown_lint }}
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-markdown-lint
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Built-in endpoints: harden-runner agent, GitHub API, checkout.
      # markdownlint-cli2-action ships bundled (dist/index.mjs) and fetches nothing.
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        github.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            **/*.md
            !.venv/**

  yamllint:
    if: ${{ inputs.enable_yamllint }}
    name: Lint YAML
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-yamllint
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Built-in endpoints: harden-runner agent, GitHub API, checkout, PyPI (yamllint).
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        files.pythonhosted.org:443
        github.com:443
        pypi.org:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hash-pinned, transitive dependencies included, wheels only: a file re-uploaded
      # to PyPI at the same version, or a source build, cannot change what runs.
      # The requirements live inline because a called workflow only sees the caller's
      # checkout, never a file of this repository. Renovate bumps the version from the
      # annotation; the hashes then fail closed until regenerated with the jq command
      # in docs/lint.md (manylinux x86_64 or py3-none-any wheels, CPython 3.12-3.14).
      - name: Run yamllint
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/yamllint-requirements.txt" <<'EOF'
          # renovate: datasource=pypi depName=yamllint
          yamllint==1.38.0 \
              --hash=sha256:fc394a5b3be980a4062607b8fdddc0843f4fa394152b6da21722f5d59013c220
          pathspec==1.1.1 \
              --hash=sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189
          pyyaml==6.0.3 \
              --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc \
              --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6 \
              --hash=sha256:c458b6d084f9b935061bc36216e8a69a7e293a2f1e68bf956dcd9e6cbcd143f5
          EOF
          pip install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/yamllint-requirements.txt"
          yamllint .

  ansible-lint:
    if: ${{ inputs.enable_ansible_lint }}
    name: Lint Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-ansible-lint
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Built-in endpoints: harden-runner agent, GitHub API, checkout, plus what the
      # ansible-lint composite action fetches: its requirements lock on
      # raw.githubusercontent.com, uv and Python from GitHub releases, and the
      # ansible-lint install from git and PyPI.
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        files.pythonhosted.org:443
        github.com:443
        pypi.org:443
        raw.githubusercontent.com:443
        release-assets.githubusercontent.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ansible/ansible-lint@e7f397ad6dfa20d274afa17cd7bbedd84ed136f5 # v26.9.0

  terraform-validate:
    if: ${{ inputs.enable_terraform_validate }}
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-terraform-validate
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Built-in endpoints: harden-runner agent, GitHub API (setup-tflint resolves its
      # release), checkout, Terraform from releases.hashicorp.com, tflint and its
      # plugins from GitHub releases.
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        github.com:443
        release-assets.githubusercontent.com:443
        releases.hashicorp.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
      - name: Terraform format check
        run: terraform fmt -check -recursive
      - name: TFLint init
        run: tflint --init
      - name: TFLint run
        run: tflint --recursive --format compact

  json-lint:
    if: ${{ inputs.enable_json_lint }}
    name: Lint JSON
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-json-lint
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      # Built-in endpoints: harden-runner agent, GitHub API, checkout, PyPI (json5).
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        files.pythonhosted.org:443
        github.com:443
        pypi.org:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hash-pinned wheel, same rule and same regeneration as the yamllint job.
      - name: Validate JSON and JSON5 files
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/json5-requirements.txt" <<'EOF'
          # renovate: datasource=pypi depName=json5
          json5==0.14.0 \
              --hash=sha256:56cf861bab076b1178eb8c92e1311d273a9b9acea2ccc82c276abf839ebaef3a
          EOF
          pip install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/json5-requirements.txt"
          exit_code=0
          while IFS= read -r -d '' f; do
            if ! python3 -c "import json, sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "Invalid JSON: $f"; exit_code=1
            else
              echo "OK: $f"
            fi
          done < <(find . -name '*.json' -not -path './.git/*' -not -path './node_modules/*' -print0)
          while IFS= read -r -d '' f; do
            if ! python3 -c "import json5, sys; json5.load(open(sys.argv[1]))" "$f"; then
              echo "Invalid JSON5: $f"; exit_code=1
            else
              echo "OK: $f"
            fi
          done < <(find . -name '*.json5' -not -path './.git/*' -not -path './node_modules/*' -print0)
          exit $exit_code

  shellcheck:
    if: ${{ inputs.enable_shellcheck }}
    name: Lint Shell (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-shellcheck
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      # Built-in harden-runner allowed endpoints:
      #   agent.api.stepsecurity.io:443 — harden-runner agent
      #   api.github.com:443            — reviewdog posts PR review comments
      #   github.com:443                — checkout + shellcheck + reviewdog binaries
      #   release-assets.githubusercontent.com:443 — binary downloads
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        github.com:443
        release-assets.githubusercontent.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-shellcheck@0a90156c6e0553996a217f0a9e09be6b0f6bee4c # v1.34.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added

  shfmt:
    if: ${{ inputs.enable_shfmt }}
    name: Format Shell (shfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-shfmt
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      # Built-in harden-runner allowed endpoints:
      #   agent.api.stepsecurity.io:443 — harden-runner agent
      #   api.github.com:443            — reviewdog posts PR suggestions
      #   github.com:443                — checkout + shfmt + reviewdog binaries
      #   release-assets.githubusercontent.com:443 — binary downloads
      _HARDEN_DEFAULTS: >-
        agent.api.stepsecurity.io:443
        api.github.com:443
        github.com:443
        release-assets.githubusercontent.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-shfmt@c5e3ba7497c338866921924691aef4fa18bc1fe0 # v1.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          filter_mode: added
