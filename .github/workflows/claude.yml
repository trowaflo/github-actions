name: Claude

# Workflow local — Claude Code pour ce repo uniquement.
# Délègue au workflow réutilisable claude-code.yml.
#
# Le filtre porte sur l'auteur du contenu que le modèle va lire, jamais sur
# github.actor : l'acteur est celui qui déclenche l'event, pas celui qui a écrit
# le texte. Pas de `assigned` : assigner une issue écrite par un tiers faisait
# lire ce texte au modèle sous l'identité du propriétaire.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

permissions: {}

# No workflow-level concurrency here: every comment of the repository runs on the
# default branch, so a per-ref group would let an unrelated comment cancel a pending
# @claude request. claude-code.yml groups its jobs per issue or pull request instead.

jobs:
  claude:
    # L'ordre compte : sur issue_comment, github.event.issue désigne l'issue et
    # son auteur, le commentaire doit donc primer.
    if: >-
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
        github.event.comment.author_association ||
        github.event.review.author_association ||
        github.event.issue.author_association)
    uses: ./.github/workflows/claude-code.yml
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
