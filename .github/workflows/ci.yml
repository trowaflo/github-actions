name: CI

# Self-CI de ce repo — valide les workflows eux-mêmes avant de les distribuer.
# Tourne uniquement sur pull_request : bloquer avant merge, pas après.

on:
  pull_request:
    # edited : le job contract lit le titre de la PR, qui peut changer sans nouveau commit.
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      enable_harden_runner: true
      harden_runner_egress_policy: block
      enable_dependency_review: true
      enable_checkov: true
      enable_trivy: true
      kics_fail_on: "high,medium,low"
      # Les deux valeurs sont les defauts, ecrites pour qu'une relecture de ce
      # fichier n'ait pas a aller les chercher ailleurs.
      gitleaks_scan_mode: full

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      security-events: write
    with:
      enable_harden_runner: true
      harden_runner_egress_policy: block
      enable_markdown_lint: true
      enable_yamllint: true
      enable_json_lint: true
      enable_ansible_lint: true
      enable_terraform_validate: true
      enable_shellcheck: true
      enable_shfmt: true

  lint-renovate:
    uses: ./.github/workflows/lint-renovate.yml
    permissions:
      contents: read
    with:
      enable_harden_runner: true
      harden_runner_egress_policy: block

  sha-check:
    name: SHA Pinning Check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify all external uses are SHA-pinned
        run: |
          # Matches both `uses:` and step syntax `- uses:`.
          # Accepts, on the uses value itself and never elsewhere on the line, so that
          # `uses: x/y@v1 # <40 hex>` is refused: a local reference (./), a 40-char
          # commit SHA, or a docker:// image pinned by sha256 digest.
          UNPINNED=$(grep -rnE '^\s*-?\s*uses:\s' .github/workflows/ \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*[^@[:space:]#]+@[0-9a-f]{40}(\s|$)' \
            | grep -vE 'uses:\s*docker://[^@[:space:]#]+@sha256:[0-9a-f]{64}(\s|$)' || true)

          if [ -n "$UNPINNED" ]; then
            echo "ERROR: Found uses: references without SHA pinning:"
            echo "$UNPINNED"
            echo ""
            echo "All external uses: must be pinned to a full 40-char SHA, or a sha256 digest for docker://."
            echo "Use: uses: owner/action@<40-char-sha> # vX.Y.Z"
            exit 1
          fi
          echo "All external uses: are properly SHA-pinned."

  contract:
    name: Contract Check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Les tags servent de référence : le dernier v* est le contrat publié.
          fetch-depth: 0
          persist-credentials: false
      - name: Compare reusable workflow contracts with the last tag
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/contract-check.sh
