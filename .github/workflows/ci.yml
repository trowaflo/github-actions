name: CI

# Self-CI de ce repo — valide les workflows eux-mêmes avant de les distribuer.
# Tourne uniquement sur pull_request : bloquer avant merge, pas après.

on:
  pull_request:

permissions: {}

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    with:
      enable_harden_runner: true
      harden_runner_egress_policy: block
      enable_dependency_review: true
      enable_checkov: true
      enable_trivy: true

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
      security-events: write
      # Requis par les jobs shellcheck et shfmt de lint.yml, qui postent via reviewdog.
      # Ils sont désactivés par défaut et ne tournent pas ici, mais GitHub valide le
      # contrat de permissions de TOUS les jobs du workflow appelé au démarrage,
      # avant d'évaluer le moindre `if:`. Sans cette ligne, startup_failure.
      pull-requests: write
    with:
      enable_harden_runner: true
      harden_runner_egress_policy: block
      enable_markdown_lint: true
      enable_yamllint: true
      enable_json_lint: true
      enable_ansible_lint: true
      enable_terraform_validate: true

  lint-renovate:
    uses: ./.github/workflows/lint-renovate.yml
    permissions:
      contents: read
    with:
      enable_harden_runner: true
      harden_runner_egress_policy: block

  sha-check:
    name: SHA Pinning Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify all external uses are SHA-pinned
        run: |
          # Matches both `uses:` and step syntax `- uses:`
          # Excludes: local workflow references (./.github/workflows/)
          UNPINNED=$(grep -rn '^\s*-\?\s*uses:\s' .github/workflows/ \
            | grep -v '\./.github/workflows/' \
            | grep -v '@[0-9a-f]\{40\}' || true)

          if [ -n "$UNPINNED" ]; then
            echo "ERROR: Found uses: references without SHA pinning:"
            echo "$UNPINNED"
            echo ""
            echo "All external uses: must be pinned to a full 40-char SHA."
            echo "Use: uses: owner/action@<40-char-sha> # vX.Y.Z"
            exit 1
          fi
          echo "All external uses: are properly SHA-pinned."
