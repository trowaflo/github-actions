name: Test Release Workflow

# Validates release.yml endpoint defaults, on demand.
#
# Triggered:
#   - workflow_dispatch (manual) only
#
# Not on pull_request: calling release.yml requires granting contents: write and
# pull-requests: write, and every pull request, Renovate's included, runs code nobody
# has reviewed yet. With that token a pull request could create a tag. The real
# exercise of release.yml is release-please.yml on every push to main.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Test release.yml (dry-run)
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      enable_release_please: true
      harden_runner_egress_policy: block
