name: Release Please

# Local workflow — crée automatiquement les tags et CHANGELOG après merge sur main
# Le premier merge du feat: donnera v0.1.0 — les consumers pinneront ce SHA

on:
  push:
    branches:
      - main

permissions: {}

# Never cancelled: a release cut in the middle can leave a tag without its release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      enable_release_please: true
      harden_runner_egress_policy: block
