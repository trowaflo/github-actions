# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
# KICS reads any docker:// reference as an unpinned action, digest included, and
# ignore-line does not reach that query. The sha-check job of ci.yml still
# enforces pinning on this file.
name: Security

# Reusable workflow — Secret scanning + IaC security scanning
# Usage: uses: trowaflo/github-actions/.github/workflows/security.yml@<sha>
#
# Defaults security-on : gitleaks, kics = true (opt-out)
# Defaults opt-in : dependency-review, checkov, trivy = false

on:
  workflow_call:
    inputs:
      checkov_framework:
        description: "Checkov framework: terraform, kubernetes, helm, dockerfile, or empty for all"
        type: string
        default: ""
      enable_checkov:
        description: "IaC misconfiguration scanning with Checkov"
        type: boolean
        default: false
      enable_dependency_review:
        description: "Dependency review on PR — requires pull_request event"
        type: boolean
        default: false
      enable_gitleaks:
        description: "Secret scanning with gitleaks"
        type: boolean
        default: true
      enable_harden_runner:
        description: "Runtime security via StepSecurity harden-runner"
        type: boolean
        default: true
      enable_kics:
        description: "IaC scanning with KICS"
        type: boolean
        default: true
      enable_trivy:
        description: "IaC/filesystem scanning with Trivy"
        type: boolean
        default: false
      gitleaks_scan_mode:
        description: "Gitleaks scan scope: full (whole history) or event (commits of the event only)"
        type: string
        default: "full"
      harden_runner_allowed_endpoints:
        description: "Extra endpoints to allow (merged with built-in defaults, space-separated)"
        type: string
        default: ""
      harden_runner_egress_policy:
        description: "Harden-runner egress policy: audit (observe) or block (enforce allowlist)"
        type: string
        default: "block"
      kics_fail_on:
        description: "KICS severities that fail the job (comma-separated high, medium, low, info; empty never fails)"
        type: string
        default: "high,medium,low"
      trivy_severity:
        description: "Trivy severity levels: UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL"
        type: string
        default: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"

permissions: {}

jobs:
  gitleaks:
    if: ${{ inputs.enable_gitleaks }}
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, not workflow-level: in a called workflow, workflow-level concurrency
    # applies to the caller's run. The file-job suffix keeps each group distinct from
    # the caller's own `<workflow>-<ref>` group, so the two cannot deadlock.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-security-gitleaks
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      # Built-in harden-runner allowed endpoints:
      #   9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443 — KICS queries (Checkmarx R2 storage)
      #   agent.api.stepsecurity.io:443 — harden-runner agent
      #   api.github.com:443 — GitHub API (actions runtime, SARIF upload, dependency-review)
      #   api0.prismacloud.io:443 — Checkov policies (Prisma Cloud API)
      #   apk.cgr.dev:443 — Chainguard APK packages (KICS container)
      #   files.pythonhosted.org:443 — pip packages (checkov)
      #   get.trivy.dev:443 — Trivy install script (trivy-action)
      #   ghcr.io:443 — container images (KICS, gitleaks)
      #   github.com:443 — git clone, actions checkout
      #   kics.io:443 — KICS scanner queries download
      #   mirror.gcr.io:443 — GCR mirror (Docker daemon)
      #   pkg-containers.githubusercontent.com:443 — GHCR storage backend
      #   pypi.org:443 — pip index (checkov)
      #   raw.githubusercontent.com:443 — GitHub raw content (gitleaks config)
      #   registry.npmjs.org:443 — npm packages (dependency-review-action)
      #   release-assets.githubusercontent.com:443 — GitHub release downloads
      _HARDEN_DEFAULTS: >-
        9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
        agent.api.stepsecurity.io:443
        api.github.com:443
        api0.prismacloud.io:443
        apk.cgr.dev:443
        files.pythonhosted.org:443
        get.trivy.dev:443
        ghcr.io:443
        github.com:443
        kics.io:443
        mirror.gcr.io:443
        pkg-containers.githubusercontent.com:443
        pypi.org:443
        raw.githubusercontent.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - name: Validate gitleaks_scan_mode
        env:
          MODE: ${{ inputs.gitleaks_scan_mode }}
        run: |
          case "$MODE" in
            event|full) echo "gitleaks scan mode: $MODE" ;;
            *) echo "ERROR: gitleaks_scan_mode must be 'event' or 'full', got '$MODE'"; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action derives its scan range from the event it sees.
      # On pull_request it calls GET /pulls/{n}/commits with no per_page, so the REST
      # default caps that page at 30 commits: a pull request of 31 commits or more is
      # scanned only up to its 30th, and the rest is never read before merge.
      # Measured 2026-09-12 on portfolio-sync: pull request #2 carries 44 commits,
      # that endpoint returns 30. Same cap on #1, 40 commits, 30 returned.
      # Those measurements were taken on v2.3.9 and still describe v3.0.0: the four
      # source files are byte-identical between the two, only the runtime changed.
      # This step keeps the annotations, the pull request comment and the job summary.
      # GITLEAKS_VERSION is written out: left unset, the binary version is whatever the
      # action hardcodes, and it moves with an action bump nobody reads as a scanner bump.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: "8.30.1"
      # gitleaks_scan_mode: full adds a second pass with no range at all, so the whole
      # history is read. It is the only scope that covers a long pull request, and the
      # only one that sees the history predating the adoption of this workflow.
      # No install and no new pin: the step above runs core.addPath() on the gitleaks
      # binary it fetched, so the same pinned version is already on PATH here.
      # Measured cost on the largest caller histories, 2026-09-12: 6.3 s for argocd
      # (1393 commits), 12.5 s for home-assistant (916), 5.8 s for helm-charts (764).
      # Runtime is not an argument. The real cost is that a secret already in the
      # history keeps every run red until it is removed from the history, which is
      # remediation, not noise. event stays available for a caller that names it.
      - name: Gitleaks, full history
        if: ${{ inputs.gitleaks_scan_mode == 'full' }}
        run: gitleaks detect --redact --no-banner -v

  kics:
    if: ${{ inputs.enable_kics }}
    name: IaC Scan (KICS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-security-kics
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    env:
      # Built-in endpoints — see first job above
      _HARDEN_DEFAULTS: >-
        9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
        agent.api.stepsecurity.io:443
        api.github.com:443
        api0.prismacloud.io:443
        apk.cgr.dev:443
        files.pythonhosted.org:443
        get.trivy.dev:443
        ghcr.io:443
        github.com:443
        kics.io:443
        mirror.gcr.io:443
        pkg-containers.githubusercontent.com:443
        pypi.org:443
        raw.githubusercontent.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The KICS image runs pinned by digest, not through kics-github-action: that
      # action builds `FROM checkmarx/kics:v2.1.20` at job setup, a mutable tag that was
      # repointed once already (2026-04-22), so its SHA pin never fixed what ran.
      # Index digest of v2.1.20, read from the registry; its linux/amd64 manifest
      # sha256:643071cf... was built 2026-03-03 from Checkmarx/kics e1f23cad, the
      # commit of tag v2.1.20, before the TeamPCP incident.
      # The image is pulled during job setup, before harden-runner starts, so no
      # Docker Hub host enters the allowlist.
      # The two flags are exclusive: --ignore-on-exit results forces the exit code to
      # zero whatever --fail-on says, which is what made this scan decoration. Empty
      # kics_fail_on restores that path; any other value bars on the listed severities.
      - name: Run KICS Scan
        uses: docker://checkmarx/kics:v2.1.20@sha256:3e5a268eb8adda2e5a483c9359ddfc4cd520ab856a7076dc0b1d8784a37e2602
        with:
          args: >-
            scan --no-progress -p . -o results --report-formats json,sarif
            ${{ inputs.kics_fail_on == '' && '--ignore-on-exit results' || format('--fail-on {0}', inputs.kics_fail_on) }}
      - name: KICS summary
        if: ${{ always() && hashFiles('results/results.json') != '' }}
        run: |
          {
            echo "### KICS"
            echo
            echo "| Severity | Findings |"
            echo "| --- | --- |"
            jq -r '.severity_counters | to_entries[] | "| \(.key) | \(.value) |"' results/results.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload KICS SARIF
        if: ${{ always() && github.event.repository.visibility == 'public' }}
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: ./results/results.sarif
          category: kics

  dependency-review:
    if: ${{ inputs.enable_dependency_review && github.event_name == 'pull_request' }}
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-security-dependency-review
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      # Built-in endpoints — see first job above
      _HARDEN_DEFAULTS: >-
        9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
        agent.api.stepsecurity.io:443
        api.github.com:443
        api0.prismacloud.io:443
        apk.cgr.dev:443
        files.pythonhosted.org:443
        get.trivy.dev:443
        ghcr.io:443
        github.com:443
        kics.io:443
        mirror.gcr.io:443
        pkg-containers.githubusercontent.com:443
        pypi.org:443
        raw.githubusercontent.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  checkov:
    if: ${{ inputs.enable_checkov }}
    name: IaC Scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-security-checkov
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    env:
      # Built-in endpoints — see first job above
      _HARDEN_DEFAULTS: >-
        9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
        agent.api.stepsecurity.io:443
        api.github.com:443
        api0.prismacloud.io:443
        apk.cgr.dev:443
        files.pythonhosted.org:443
        get.trivy.dev:443
        ghcr.io:443
        github.com:443
        kics.io:443
        mirror.gcr.io:443
        pkg-containers.githubusercontent.com:443
        pypi.org:443
        raw.githubusercontent.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bridgecrewio/checkov-action@4048c972aae68d0b983a48bb3479aab2d877b898 # v12.3102.0
        with:
          directory: .
          framework: ${{ inputs.checkov_framework }}
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
      - name: Upload Checkov SARIF
        if: ${{ always() && github.event.repository.visibility == 'public' }}
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  trivy:
    if: ${{ inputs.enable_trivy }}
    name: IaC Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-security-trivy
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    env:
      # Built-in endpoints — see first job above
      _HARDEN_DEFAULTS: >-
        9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
        agent.api.stepsecurity.io:443
        api.github.com:443
        api0.prismacloud.io:443
        apk.cgr.dev:443
        files.pythonhosted.org:443
        get.trivy.dev:443
        ghcr.io:443
        github.com:443
        kics.io:443
        mirror.gcr.io:443
        pkg-containers.githubusercontent.com:443
        pypi.org:443
        raw.githubusercontent.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
    steps:
      - name: Harden Runner
        if: ${{ inputs.enable_harden_runner }}
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: ${{ inputs.harden_runner_egress_policy }}
          allowed-endpoints: ${{ env._HARDEN_DEFAULTS }} ${{ inputs.harden_runner_allowed_endpoints }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: ${{ inputs.trivy_severity }}
      - name: Run Trivy (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: ${{ inputs.trivy_severity }}
      - name: Upload Trivy SARIF
        if: ${{ always() && github.event.repository.visibility == 'public' }}
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy
